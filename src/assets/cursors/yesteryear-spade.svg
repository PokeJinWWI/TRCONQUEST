  </defs>
  <g transform="translate(3.6 3.6) rotate(-45) translate(-16 -3)">
    <path d="M16 3 C16 3 6 12 6 18 C6 21.5 9 23.5 11.8 23 C13 22.8 14.5 22 15 21 C14.8 24 13.5 26.5 11 28 L21 28 C18.5 26.5 17.2 24 17 21 C17.5 22 19 22.8 20.2 23 C23 23.5 26 21.5 26 18 C26 12 16 3 16 3 Z"
          fill="#1a0509" stroke="#1a0509" stroke-width="3.2" stroke-linejoin="round"/>
